description: >-
  Google publishes NO plans, tiers or pricing for the PageSpeed Insights API. There is no
  pricing page, no billing surface and no paid tier: access is granted by creating a free
  API key in the Google Cloud Console, and consumption is governed by a project quota
  rather than by a purchased plan. plan_count is 0 because that is the true measurement,
  not because the search failed.
plans: []
access_model:
  pricing: free
  billing: none
  paid_tier: false
  key_required: recommended-by-docs, effectively-required-in-practice
  onboarding: self-serve
  provisioning: https://console.cloud.google.com/apis/credentials
  quota_management: >-
    Quota for pagespeedonline.googleapis.com is managed per Cloud project in the Console
    quotas page, which requires a signed-in Google account. Google does not publish the
    numeric default anywhere on the public PageSpeed documentation.
  see: rate-limits/google-pagespeed-rate-limits.yml
evidence:
  - {url: 'https://developers.google.com/speed/docs/insights/v5/get-started', status: 200, finding: instructs callers to create a free API key; no price, plan or tier named}
  - {url: 'https://developers.google.com/speed/docs/insights/v5/about', status: 200, finding: no pricing, cost, quota or limit statement anywhere on the page}
  - {url: 'https://developers.google.com/speed/docs/insights/release_notes', status: 200, finding: no pricing or plan change ever recorded}
supersedes:
  note: >-
    This file replaces a 2026-05-04 bulk-sweep scaffold that invented Free / Professional
    / Enterprise tiers with placeholder quotas (1,000 and 100,000 requests per month) and
    "TBD" prices. None of those tiers exist. See roadmap#35.
