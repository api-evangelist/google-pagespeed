findings:
  - >-
    The Discovery document's Categories entity carries an `agentic-browsing` category
    alongside performance, accessibility, best-practices, seo and pwa. It is present in
    the live contract (revision 20260811) but is not documented on the PageSpeed Insights
    reference pages and is not among the four values the `category` query parameter
    accepts, so it can only be read out of a response, not requested.
  - >-
    Two of the root's four child objects (loadingExperience, originLoadingExperience)
    hang off the CrUX field-data branch Google has announced it intends to remove.
    Roughly a quarter of the top-level response shape is on notice.
  - >-
    The refined OpenAPI in this repo models 5 schemas against the Discovery document's
    20. Consumers wanting the full response shape should read the Discovery document or
    json-schema/google-pagespeed-result-schema.json rather than the OpenAPI components.
