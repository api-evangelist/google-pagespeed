note: >-
  Google does not ship a PageSpeed-Insights-only SDK. Access is delivered through the
  Google APIs client libraries, which the PageSpeed Insights "Libraries and Samples"
  page names as the supported client surface. Two of them are genuinely
  PageSpeed-specific generated packages (the Ruby google-apis-pagespeedonline_v5 gem,
  the Java com.google.apis:google-api-services-pagespeedonline artifact, the .NET
  Google.Apis.PagespeedInsights.v5 package and the npm @googleapis/pagespeedonline
  module); the rest are umbrella clients that cover every Google Discovery API,
  including pagespeedonline v5. Versions and dates read from each registry's
  metadata endpoint on 2026-08-13.
