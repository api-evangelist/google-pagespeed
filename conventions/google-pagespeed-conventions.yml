  rfc9457: false
  content_type: application/json
  see: errors/google-pagespeed-problem-types.yml
rate_limit_signaling:
  headers: none
  observed_headers: []
  exhaustion_status: 429
  retry_after: false
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is returned, on success or on
    exhaustion. An agent gets no runtime budget signal and must back off blind on 429.
  see: rate-limits/google-pagespeed-rate-limits.yml
long_running:
  async: false
  timeout_seconds: 120
  note: >-
    The call runs a real Lighthouse audit synchronously; Google's release notes record
    the maximum request timeout being raised to 120 seconds. Set client timeouts
    accordingly — this is the convention most integrations get wrong.
webhooks_events:
