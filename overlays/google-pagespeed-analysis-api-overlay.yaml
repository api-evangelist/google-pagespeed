  - target: $.servers
    update:
      - url: https://pagespeedonline.googleapis.com/pagespeedonline/v5
        description: >-
          Service-specific host published in the Discovery document (rootUrl
          https://pagespeedonline.googleapis.com/, method path
          pagespeedonline/v5/runPagespeed). Equivalent to the www.googleapis.com alias
          already declared.
  - target: $.paths['/runPagespeed'].get
    update:
      x-timeout-seconds: 120
      x-timeout-note: >-
        Google's release notes record the maximum API request timeout being raised to
